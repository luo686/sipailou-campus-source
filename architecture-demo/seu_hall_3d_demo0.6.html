<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>东南大学大礼堂 · 3D 交互概念 Demo</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e4d9;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}canvas{display:block;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none;color:#25322d}header{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;gap:16px;align-items:start}.eyebrow{font-size:11px;letter-spacing:.22em;font-weight:700;color:#547064}h1{font-family:Georgia,'Songti SC',serif;font-size:clamp(21px,3vw,34px);margin:8px 0 5px;font-weight:500}.sub{font-size:12px;opacity:.65}.tag{border:1px solid #8b9b8f80;border-radius:30px;padding:8px 12px;font-size:11px;white-space:nowrap;background:#f8f5edb8}.panel{position:absolute;bottom:22px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:end;gap:12px}.hint{font-size:12px;line-height:1.9;background:#faf7efcf;border:1px solid #fff9;border-radius:13px;padding:12px 15px;backdrop-filter:blur(10px)}.controls{display:flex;flex-wrap:wrap;justify-content:end;gap:7px;pointer-events:auto}.controls button{background:#fbfaf4e8;color:#26372e;border:1px solid #aebdb2;border-radius:9px;padding:11px 13px;font-size:12px;cursor:pointer;backdrop-filter:blur(8px)}.controls button.active,.controls button:hover{background:#2c5144;color:white}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#e9e4d9;color:#31483d;font-size:14px;z-index:5}.hidden{display:none}.loading.failed{align-content:center;gap:18px;padding:28px;text-align:center}.loading a{color:#2c5144;text-underline-offset:4px}.controls button:disabled{opacity:.45;cursor:default}@media(max-width:650px){header{top:16px;left:16px;right:16px}.tag{display:none}.panel{bottom:15px;left:14px;right:14px;flex-direction:column;align-items:stretch}.hint{font-size:11px;padding:8px 12px}.controls{justify-content:stretch}.controls button{flex:1;padding:11px 5px;font-size:11px}h1{font-size:24px}}
</style></head><body><div id="loading" class="loading" role="status" aria-live="polite">正在构建校园建筑场景…</div><div id="ui"><header><div><div class="eyebrow">SIPAILOU CAMPUS · 3D STUDY</div><h1>东南大学 · 大礼堂</h1><div class="sub">中央圆形喷水池 · 可交互建筑概念模型</div></div><div class="tag">INTERACTIVE ARCHITECTURE / 01</div></header><div class="panel"><div class="hint">↻ 拖动旋转　·　双指 / 滚轮缩放　·　右键平移<br/>概念性几何复原，非实测建筑模型</div><div class="controls"><button id="front">正视角</button><button id="top">俯视角</button><button id="reset">重置</button><button id="auto" aria-pressed="true" class="active">自动旋转：开</button></div></div></div><script>
(() => {
  const loading=document.getElementById('loading');
  let failed=false;
  function fail(){
    if(failed)return;failed=true;document.body.dataset.sceneState='failed';
    loading.classList.remove('hidden');loading.classList.add('failed');loading.setAttribute('role','alert');
    const message=document.createElement('span');message.textContent='3D 视图暂时无法加载，请返回建筑详情继续参观。';
    const link=document.createElement('a');link.textContent='返回大礼堂详情';
    const language=new URLSearchParams(location.search).get('lang');
    link.href='index.html'+(language?'?lang='+encodeURIComponent(language):'')+'#building/hall';
    loading.replaceChildren(message,link);
    document.querySelectorAll('.controls button').forEach(button=>button.disabled=true);
  }
  function load(src){return new Promise((resolve,reject)=>{
    const script=document.createElement('script');let timer=setTimeout(()=>{script.remove();reject(new Error('load timeout'));},12000);
    script.src=src;script.onload=()=>{clearTimeout(timer);resolve();};
    script.onerror=()=>{clearTimeout(timer);reject(new Error('load failed'));};document.head.append(script);
  });}
  (async()=>{
    try{
      await load('assets/hall-3d-vendor.js?v=169');
      await load('assets/hall-3d-scene.js?v=1');
      if(failed)return;
      if(typeof window.startHallScene!=='function')throw new Error('scene unavailable');
      window.startHallScene(fail);
      if(!failed){document.body.dataset.sceneState='ready';loading.classList.add('hidden');}
    }catch(error){fail();}
  })();
})();
</script></body></html>

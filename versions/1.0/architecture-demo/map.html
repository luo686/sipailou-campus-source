<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="mapTitle">建筑位置地图</title><style>*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#dce7cf;font-family:'Microsoft YaHei',sans-serif}#map-context{flex:none;padding:12px 16px;background:#fffef5;color:#304c3b;border-bottom:1px solid #bbc9af}#map-heading{font-size:20px;line-height:1.35;margin:0 0 6px;overflow-wrap:anywhere}#map-navigation{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:6px}#map-navigation a{color:#304c3b;min-height:32px;display:inline-flex;align-items:center}#map-description,#map-help{font-size:12px;line-height:1.5;margin:4px 0;overflow-wrap:anywhere}.map-shell{position:relative;flex:1;min-height:0}#map{width:100%;height:100%}#map canvas:focus-visible{outline:3px solid #8a5b20;outline-offset:-4px}a:focus-visible{outline:3px solid #8a5b20;outline-offset:2px}[hidden]{display:none!important}.compass{position:absolute;right:23px;top:17px;color:#536b50;text-align:center;pointer-events:none;font-size:12px}.compass b{display:block;font-size:22px}.tools{position:absolute;right:15px;bottom:26px;display:grid;background:#fffef5e8;border:1px solid #d5ddcb;border-radius:5px;overflow:hidden}.tools button{width:43px;height:43px;border:0;border-bottom:1px solid #dfe4d7;background:transparent;color:#395e48;font-size:23px;cursor:pointer}.tools button:last-child{border-bottom:0;font-size:21px}.tools button .keyline-icon{display:block;margin:auto}.tools button:focus-visible{outline:3px solid #a97732;outline-offset:-3px}.credit{position:absolute;right:8px;bottom:3px;font-size:8px;color:#4f6648}.credit a{color:inherit}#map-error{position:absolute;top:40%;left:10%;right:10%;text-align:center;font-size:13px}</style></head><body><header id="map-context"><h1 id="map-heading">建筑位置地图</h1><nav id="map-navigation" aria-label="地图导航"><a id="map-return">返回建筑</a><a id="map-directory">建筑目录</a></nav><p id="map-description"></p><p id="map-help"></p></header><main class="map-shell"><div id="map" aria-label="建筑位置地图，可拖动和缩放" data-i18n-label="mapLabel"></div><div class="compass">N<b>↑</b></div><div class="tools" aria-label="地图工具" data-i18n-label="mapTools"><button id="zoom-in" aria-label="放大地图" data-i18n-label="zoomIn" data-keyline-icon="plus" data-icon-size="22">＋</button><button id="zoom-out" aria-label="缩小地图" data-i18n-label="zoomOut" data-keyline-icon="minus" data-icon-size="22">−</button><button id="focus-building" aria-label="回到当前建筑" data-i18n-label="recenter" title="回到当前建筑" data-i18n-title="recenter" data-keyline-icon="crosshair" data-icon-size="22">⌖</button></div><div class="credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div><p id="map-error" data-i18n="mapError" hidden>地图暂时无法加载，请刷新重试。</p></main><script src="published-buildings.js?v=0.3"></script><script src="campus-language.js?v=0.3"></script><script src="buildings-en.js?v=0.3"></script><script src="icons.js?v=0.3"></script><script src="../vendor/phaser.min.js"></script><script src="assets/classic-layout.js?v=0.3"></script><script src="location-map.js?v=1.1"></script></body></html>
